{% extends 'layouts/base.html' %}{% block content %}<section class="page-head"><div><span class="eyebrow">IMPORT</span><h1>Excel 업로드</h1><p>Sheet별 구조를 자동 분석하고 컬럼·병합 셀·표 영역을 인식합니다.</p></div></section><section class="panel upload-panel"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="dropzone" id="dropzone"><input type="file" name="file" id="fileInput" accept=".xlsx,.xlsm" required><div class="upload-mark">↑</div><h2>Excel 파일을 여기에 놓으세요</h2><p>또는 클릭해서 선택 · XLSX / XLSM · 최대 100MB</p><span id="fileName"></span></label><label class="check-field"><input type="checkbox" name="allow_duplicate" value="1" {% if duplicate_of %}checked{% endif %}> 중복이어도 업로드 (같은 내용의 파일이 이미 있어도 새로 등록)</label><button class="primary wide">업로드 및 자동 분석</button></form><div class="feature-list"><div><b>자동 헤더 감지</b><span>제목행이 위에 있어도 표의 헤더를 찾아냅니다.</span></div><div><b>병합 셀 보정</b><span>구분·위치 같은 병합 값을 행 데이터에 반영합니다.</span></div><div><b>동적 컬럼/필터</b><span>Excel 열을 그대로 DB와 화면에 반영합니다.</span></div></div></section>{% endblock %}{% block scripts %}<script>const i=document.getElementById('fileInput');i.addEventListener('change',()=>document.getElementById('fileName').textContent=i.files[0]?.name||'');</script>{% endblock %}
